apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kiali-remote
rules:
- apiGroups: [""]
  resources: ["configmaps","endpoints","pods","pods/log","namespaces","nodes","replicationcontrollers","services"]
  verbs: ["get","list","watch"]
- apiGroups: ["extensions","apps"]
  resources: ["daemonsets","deployments","replicasets","statefulsets"]
  verbs: ["get","list","watch"]
- apiGroups: ["batch"]
  resources: ["cronjobs","jobs"]
  verbs: ["get","list","watch"]
- apiGroups: ["networking.istio.io","security.istio.io","extensions.istio.io","telemetry.istio.io","gateway.networking.k8s.io"]
  resources: ["*"]
  verbs: ["get","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kiali-remote
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kiali-remote
subjects:
- kind: ServiceAccount
  name: kiali-remote
  namespace: istio-system
